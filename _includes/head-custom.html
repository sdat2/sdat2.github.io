<!-- MathJax 3: kramdown emits \(...\) and \[...\] which MathJax 3 handles natively. -->
<style>
  :root {
    --font-latex-serif: "Latin Modern Roman", "CMU Serif", "Computer Modern Serif", "Times New Roman", serif;
    --bg-top: #f3f8f5;
    --bg-bottom: #fffaf2;
    --panel: rgba(255, 255, 255, 0.85);
    --ink: #122432;
    --ink-soft: #325063;
    --accent: #8daf9c;
    --accent-strong: #5d7b6d;
    --line: #d7e2dc;
    --shadow: 0 14px 32px rgba(14, 39, 56, 0.12);
  }

  body {
    color: var(--ink);
    font-family: var(--font-latex-serif);
    line-height: 1.65;
    background:
      radial-gradient(circle at 0% 0%, rgba(141, 175, 156, 0.24), transparent 36%),
      radial-gradient(circle at 100% 20%, rgba(250, 200, 98, 0.16), transparent 34%),
      linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
  }

  #header_wrap {
    background: rgba(247, 252, 248, 0.82);
    border-bottom: 1px solid rgba(18, 36, 50, 0.1);
  }

  #main_content_wrap,
  #footer_wrap {
    background: transparent;
  }

  #main_content_wrap {
    border-top: 0;
  }

  #header_wrap .inner,
  #main_content_wrap .inner,
  #footer_wrap .inner {
    width: min(960px, calc(100% - 2.2rem));
    max-width: none;
    margin: 0 auto;
  }

  #project_title,
  #project_tagline,
  #main_content h1,
  #main_content h2,
  #main_content h3,
  #main_content h4,
  #main_content h5,
  #main_content h6 {
    font-family: var(--font-latex-serif);
    text-shadow: none;
  }

  #project_title,
  #main_content h1,
  #main_content h2,
  #main_content h3,
  #main_content h4,
  #main_content h5,
  #main_content h6 {
    color: #2a4a40;
  }

  #project_tagline,
  #footer_wrap .inner {
    color: #35584c;
  }

  #project_tagline a {
    color: inherit;
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: color 0.14s ease, border-color 0.14s ease;
  }

  #project_tagline a:hover,
  #project_tagline a:focus {
    color: #1f3c34;
    border-bottom-color: rgba(42, 74, 64, 0.45);
  }

  #main_content {
    margin: 1.35rem 0 2.4rem;
    padding: clamp(1rem, 2vw, 2rem);
    background: var(--panel);
    border: 1px solid rgba(42, 74, 64, 0.1);
    border-radius: 18px;
    box-shadow: var(--shadow);
  }

  #main_content p,
  #main_content li {
    font-size: 1.04rem;
  }

  #main_content a {
    color: #3f6d63;
  }

  #main_content a:hover,
  #main_content a:focus,
  #footer_wrap a:hover,
  #footer_wrap a:focus {
    color: #2f564e;
  }

  #main_content img {
    border-radius: 10px;
  }

  @media (max-width: 760px) {
    #main_content {
      border-radius: 14px;
      padding: 1rem;
    }

    #main_content p,
    #main_content li {
      font-size: 1rem;
    }
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    var tagline = document.getElementById("project_tagline");
    if (!tagline) {
      return;
    }

    tagline.textContent = "";
    var link = document.createElement("a");
    link.href = "https://sdat2.github.io/thesis/";
    link.textContent = "PhD Thesis";
    tagline.appendChild(link);
  });
</script>

<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$']],
      displayMath: [['\\[', '\\]']],
      processEscapes: true
    },
    options: { skipHtmlTags: ['script','noscript','style','textarea','pre'] }
  };
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
